# Fluxo de deploy do banco:
#   1. db       -> sobe o MySQL e espera ficar saudável (healthcheck)
#   2. migrate  -> aplica as migrations pendentes e encerra
#   3. api      -> só sobe se as migrations terminarem com sucesso
#
# Uso: docker compose up -d --build

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-coresync}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    ports:
      - '${DB_EXPOSED_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  migrate:
    build: .
    command: ['npm', 'run', 'migration:run:prod']
    environment: &db-env
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-coresync}
      DB_USERNAME: ${DB_USERNAME:-coresync}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SYNCHRONIZE: 'false'
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build: .
    restart: unless-stopped
    environment:
      <<: *db-env
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 8080
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET:-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${PORT:-8080}:8080'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
  uploads:
